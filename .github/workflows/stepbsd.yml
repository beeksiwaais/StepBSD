name: StepBSD ISO

# Builds the StepBSD live/installer ISOs for amd64 and arm64 (NextBSD + the
# GNUstep desktop), tests each end to end in qemu on a runner of its own
# architecture (install to disk, BIOS + UEFI boot of the
# installed system, desktop screenshot) and publishes it to the rolling
# `continuous` release.
#
# The weekly schedule is what keeps a StepBSD image current without a commit:
# every build installs the latest NextBSD packages (nextbsd-pkg) and the latest
# FreeBSD GNUstep/X packages (pkg.FreeBSD.org .../latest).
#
# Upstream's own build.yml (NextBSD's images) is disabled in this repository.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - 'NOTICE'
      - 'docs/**'
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 1'

permissions:
  contents: write

concurrency:
  group: stepbsd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The ports StepBSD builds itself (stepbsd/ports.txt), natively per arch:
  # an x86_64 VM, and an aarch64 VM (emulated, which vmactions recommends on
  # the x86 runner). The result is a pkg repository the image build installs
  # from and the release publishes as packages-<arch>.
  ports:
    name: ports (${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            vm_arch: x86_64
          - arch: arm64
            vm_arch: aarch64
    steps:
      - uses: actions/checkout@v4

      - name: build stepbsd/ports.txt inside FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: '15.1'
          arch: ${{ matrix.vm_arch }}
          mem: 8192
          cpu: 4
          usesh: true
          sync: rsync
          copyback: true
          run: |
            set -eu
            sh stepbsd/build-ports.sh stepbsd-packages

      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.arch }}
          path: stepbsd-packages/
          retention-days: 14
          if-no-files-found: error

  build:
    name: build (${{ matrix.arch }})
    needs: ports
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        # Both arches build in the same x86 FreeBSD VM, as NextBSD's do: pkg
        # installs the aarch64 packages host-side (pkg -r) and makefs/mkuzip/
        # mkimg are arch-agnostic.
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - name: free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false

      # One date per run would be nicer, but matrix legs cannot share a step
      # output; each leg stamps its own artifacts and the release job reads
      # the names back from the files.
      - name: compute build date
        id: meta
        run: echo "date=$(date -u +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          name: packages-${{ matrix.arch }}
          path: stepbsd-packages/

      - name: build ISO inside FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: '15.1'
          mem: 8192
          cpu: 4
          usesh: true
          sync: rsync
          copyback: true
          prepare: |
            pkg install -y bash git rsync zip
          run: |
            set -eu
            export FREEBSD_VERSION=15.1 ARCH=${{ matrix.arch }} ASSEMBLY=pkg DIST_NAME=StepBSD
            export IMG_DATE=${{ steps.meta.outputs.date }}
            export STEPBSD_PKG_URL=https://github.com/${{ github.repository }}/releases/download/packages-${{ matrix.arch }}
            sh build.sh
            # Only out/ needs to come back to the runner; the staged rootfs
            # is several GiB.
            chflags -R noschg work 2>/dev/null || true
            rm -rf work distfiles

      - name: unpack the ISO, checksums
        run: |
          set -eu
          N=StepBSD-${{ matrix.arch }}-${{ steps.meta.outputs.date }}
          cd out
          unzip -o "$N.iso.zip"
          rm "$N.iso.zip"
          sha256sum "$N.iso" > "$N.iso.sha256"
          sha256sum "$N.img.zip" > "$N.img.zip.sha256"
          ls -lh
          {
            echo "### $N"
            echo
            echo '```'
            ls -lh
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.arch }}
          path: out/
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

  install-test:
    name: install test (${{ matrix.arch }})
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # amd64 gets KVM. GitHub's arm64 runner has no /dev/kvm, so that
          # guest runs on same-arch TCG and gets more time for the desktop.
          - arch: amd64
            runner: ubuntu-24.04
            packages: qemu-system-x86 ovmf
            gui_wait: 150
          - arch: arm64
            runner: ubuntu-24.04-arm
            packages: qemu-system-arm qemu-efi-aarch64
            gui_wait: 420
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: image-${{ matrix.arch }}
          path: out/

      - name: install qemu + expect
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ matrix.packages }} qemu-utils expect

      - name: install, boot and desktop test
        env:
          ARCH: ${{ matrix.arch }}
          GUI_WAIT: ${{ matrix.gui_wait }}
        run: sh tests/stepbsd-install-test.sh out/StepBSD-${{ matrix.arch }}-*.iso

      - name: upload test logs and screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-test-${{ matrix.arch }}
          path: |
            tests/out/*.log
            tests/out/*.png
          retention-days: 14
          if-no-files-found: ignore

  release:
    name: publish continuous
    needs: [build, install-test]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: image-*
          path: out/
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          pattern: install-test-*
          path: test/

      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: packages/

      # The pkg repository installed systems upgrade StepBSD's own ports from
      # (/usr/local/etc/pkg/repos/StepBSD.conf): one flat release per arch,
      # like nextbsd-pkg. Published before the images that point at it.
      - name: publish the StepBSD pkg repositories
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          for a in amd64 arm64; do
            t=packages-$a
            gh release view "$t" >/dev/null 2>&1 ||
              gh release create "$t" --title "StepBSD packages ($a)" --prerelease \
                --notes "pkg repository for StepBSD $a: the ports in stepbsd/ports.txt, built with StepBSD's options. Configured on every StepBSD install as /usr/local/etc/pkg/repos/StepBSD.conf."
            for f in $(gh release view "$t" --json assets --jq '.assets[].name'); do
              gh release delete-asset "$t" "$f" --yes
            done
            gh release upload "$t" packages/packages-$a/* --clobber
          done

      - name: publish to the continuous release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          for a in amd64 arm64; do
            iso=$(ls out/StepBSD-$a-*.iso)
            cp "test/install-test-$a/desktop.png" "${iso%.iso}-desktop.png" 2>/dev/null || true
          done
          ls -lh out/
          cat > notes.md <<NOTES
          Rolling StepBSD build from \`${GITHUB_SHA}\`: NextBSD (launchd, Mach, Darwin
          userland) with the GNUstep desktop (Window Maker + GWorkspace).

          | | amd64 (x86-64 PCs) | arm64 (UEFI: VMs, Apple Silicon VMs, Arm servers) |
          |---|---|---|
          | live + installer ISO | \`$(basename out/StepBSD-amd64-*.iso)\` | \`$(basename out/StepBSD-arm64-*.iso)\` |
          | installed disk image | \`$(basename out/StepBSD-amd64-*.img.zip)\` | \`$(basename out/StepBSD-arm64-*.img.zip)\` |

          The ISO boots BIOS or UEFI (amd64) or UEFI (arm64). It logs \`admin\` in and
          starts the desktop. Run \`sudo stepbsd-install\` in Terminal to install to disk.

          CI installed each ISO to a disk in qemu, booted the installed system
          (amd64 with BIOS and with UEFI, arm64 with UEFI), and checked GNUstep at
          run time. The \`*-desktop.png\` screenshots are the desktops from those
          runs.
          NOTES
          gh release view continuous >/dev/null 2>&1 ||
            gh release create continuous --title "StepBSD continuous" --notes "first build" --prerelease
          # Replace every asset of the previous build.
          for a in $(gh release view continuous --json assets --jq '.assets[].name'); do
            gh release delete-asset continuous "$a" --yes
          done
          gh release upload continuous out/* --clobber
          gh release edit continuous --title "StepBSD continuous $(date -u +%Y-%m-%d)" --notes-file notes.md --prerelease
          git tag -f continuous "$GITHUB_SHA"
          git push -f origin refs/tags/continuous
