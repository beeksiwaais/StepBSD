name: Sync NextBSD upstream

# Weekly: merge nextbsd/nextbsd main into the `sync/upstream` branch, build and
# test the ISO on it (stepbsd.yml via workflow_dispatch, the one event a
# GITHUB_TOKEN push can start), and open a pull request to main. A merge
# conflict opens an issue instead. StepBSD's changes to upstream files are two
# hook lines in build.sh plus the README (kept ours, see .gitattributes), so
# conflicts should be rare.
#
# Needs "Allow GitHub Actions to create and approve pull requests" enabled in
# the repository's Actions settings.

on:
  schedule:
    - cron: '41 2 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: merge upstream into sync/upstream
        id: merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config merge.ours.driver true
          git remote add upstream https://github.com/nextbsd/nextbsd.git
          git fetch --no-tags upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "already up to date with upstream"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git switch -C sync/upstream
          if ! git merge --no-edit -m "Merge nextbsd/nextbsd main" upstream/main; then
            files=$(git diff --name-only --diff-filter=U | sed 's/^/- /')
            git merge --abort
            gh issue create --title "Upstream sync: merge conflict ($(date -u +%F))" --body "Merging nextbsd/nextbsd \`$(git rev-parse --short upstream/main)\` into main conflicts in:

          $files

          Resolve by hand: \`git fetch upstream && git merge upstream/main\`."
            exit 1
          fi
          git push -f origin sync/upstream
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: build + test, open the pull request
        if: steps.merge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          gh workflow run stepbsd.yml --ref sync/upstream
          gh pr view sync/upstream >/dev/null 2>&1 ||
            gh pr create --base main --head sync/upstream \
              --title "Sync with nextbsd/nextbsd" \
              --body "Weekly merge of nextbsd/nextbsd main. The **StepBSD ISO** workflow run on \`sync/upstream\` builds and install-tests the result; merge when it is green."
